# ── Default Values ────────────────────────────────────────────

global:
  namespace: fraud-detection

# ── Fraud Service ─────────────────────────────────────────────
fraudService:
  replicaCount: 3
  image:
    repository: fraud-service
    tag: latest
    pullPolicy: Always
  grpc:
    port: 50051
  metrics:
    port: 9090
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilization: 70
  pdb:
    enabled: true
    minAvailable: 2
  config:
    approveThreshold: 0.30
    reviewThreshold: 0.70
    defaultModel: xgboost-v1
    timeoutMs: 50

# ── Redis ─────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 64Gi
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: 2000m
        memory: 8Gi
  replica:
    replicaCount: 0  # standalone mode

# ── Kafka ─────────────────────────────────────────────────────
kafka:
  enabled: true
  replicas: 3
  autoCreateTopicsEnable: false
  defaultReplicationFactor: 1
  numPartitions: 12
  logRetentionHours: 72
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# ── Flink Deployments ────────────────────────────────────────
flink:
  image:
    repository: fraud-flink-jobs
    tag: latest
  jobManager:
    resource:
      memory: 2048m
      cpu: 1
  taskManager:
    resource:
      memory: 4096m
      cpu: 2
  parallelism:
    velocity: 16
    behavioral: 16
    device: 8
    pipeline: 8

# ── Monitoring ────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
    retention: 30d
  grafana:
    enabled: true
    dashboards:
      enabled: true
  alerting:
    enabled: true
    pagerduty:
      enabled: false

# ── Network Policies ─────────────────────────────────────────
networkPolicies:
  enabled: true

# ── Service Accounts ─────────────────────────────────────────
serviceAccounts:
  create: true
  fraudService:
    name: fraud-service
  flink:
    name: flink
