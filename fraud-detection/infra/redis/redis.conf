# ── Redis Configuration for Fraud Detection Feature Store ────
# Reference: SPEC §3.3

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Memory
maxmemory 2gb
maxmemory-policy noeviction

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Performance
hz 10
dynamic-hz yes
io-threads 4
io-threads-do-reads yes

# Logging
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency tracking
latency-tracking yes
latency-tracking-info-percentiles "50 99 99.9"
